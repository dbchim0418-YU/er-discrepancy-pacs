# 이 파일을 복사해 `.streamlit/secrets.toml`로 저장하고 값을 채운다.
# secrets.toml은 .gitignore에 있으므로 GitHub에 올라가지 않는다.
# 실제 값은 팀 개인 메시지로 전달받는다.

[app]
# "fake": 역할만 골라 들어가는 임시 로그인 (1주차 개발용)
# "firebase": Firebase Authentication 실제 로그인
auth_mode = "fake"
# 파일 저장 위치 (로컬 개발용). 배포 시 JCloud 영구 저장 경로로 바꾼다.
storage_root = "data/storage"

[firebase]
# Firebase 콘솔 → 프로젝트 설정 → 일반 → 웹 API 키
web_api_key = ""

[firebase.service_account]
# Firebase 콘솔 → 프로젝트 설정 → 서비스 계정 → 새 비공개 키 생성 (JSON 내용을 옮겨 적기)
type = "service_account"
project_id = ""
private_key_id = ""
private_key = ""
client_email = ""
client_id = ""
token_uri = "https://oauth2.googleapis.com/token"
